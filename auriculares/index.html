<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/estilo.css" />
    <title>TechStore</title>
  </head>

  <body>
    <nav>
      <span>TechStore</span>
      <div class="carrito">
        Carrito
        <div class="cont" id="count">0</div>
      </div>
    </nav>

    <main>
      <div class="card">
        <div class="card-imagen">
          <img
            src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=520&q-80"
            alt="auri"
          />
        </div>
        <div class="info">
          <span class="nuevo">Nuevo lanzamiento</span>
          <h2>Auriculares Pulse Pro</h2>
          <p>
            Auriculares inalámbricos con sonido envolvente, cancelación de ruido
            y batería de larga duración para escuchar música todo el día.
          </p>
          <div class="precio">$89.999</div>
          <button class="boton" id="boton-comprar">Agregar al carrito</button>
        </div>
      </div>
    </main>
    <script src="./style/java.js"></script>
  </body>
</html>
