<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./pag.css">
   

    <title>ig</title>
</style>
</head>
<body>
 
  <div class="izquierda">
    <div class="ig-logo">
    <img src="capnueva.png" alt="Instagram" class="logo-img">
    </div>
 
    <div class="headline">
      Mira los momentos cotidianos<br>
     &nbsp; &nbsp; &nbsp; de tus <span class="accent">mejores amigos</span>.
    </div>
 
    <div class="celus">
      <img src="celus.jpg" alt="Story mockup" class="celus-img">
    </div>
  </div>
 
  <div class="derecha">
    <div class="login-box">
      <h2>Iniciar sesión en Instagram</h2>
      <input type="text" placeholder="Número de celular, nombre de usuario o correo electrónico">
      <input type="password" placeholder="Contraseña">
      <button class="login-btn">Iniciar sesión</button>
      <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
 
      <button class="fb-btn"><img src="face.jpg" alt="Facebook" class="fb-icono"> Iniciar sesión con Facebook</button>
      <button class="signup-btn">Crear cuenta nueva</button>
 
      <div class="meta-logo"><img src="meta.jpg" alt="Meta" class="meta-icono"> Meta</div>
    </div>
  </div>
 
</body>
</html>
